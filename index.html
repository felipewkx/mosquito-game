<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mosquito Smash</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="game-container">
      <!-- HUD -->
      <div id="hud">
        <div class="hud-badge score-badge">
          <span class="badge-icon">⭐</span> Score: <span id="score">0</span>
        </div>
        <div class="hud-badge timer-badge">
          <span class="badge-icon">⏰</span> Time: <span id="timer">30</span>s
        </div>
      </div>

      <!-- Start / Game Over screen -->
      <div id="start-screen">
        <h1 class="game-title">🦟 Mosquito Smash!</h1>
        <p class="tagline">Smash those pesky bugs!</p>
        <p id="game-over-message" class="game-over-message"></p>
        <input
          type="text"
          id="player-name"
          placeholder="Enter Your Name"
          maxlength="10"
          autocomplete="off"
        />
        <button id="start-btn">🚀 Start Game!</button>

        <div id="leaderboard">
          <h3>🏆 Top Hunters</h3>
          <ul id="rank-list"></ul>
        </div>
      </div>

      <!-- Particle effects container -->
      <div id="particles"></div>
    </div>

    <!-- Audio -->
    <audio id="slap-sound" src="assets/slap.mp3" preload="auto"></audio>
    <audio id="buzz-sound" src="assets/buzz.mp3" loop preload="auto"></audio>

    <!-- Main script -->
    <script src="script.js"></script>
  </body>
</html>
